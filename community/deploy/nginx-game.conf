# game.xiaolubao.com — the community site's public reverse proxy.
#
# 2026-10-08: the game moved to hk.xiaolubao.com (see hk.xiaolubao.com.conf), and this brand name now serves the
# community site (community/, an independent node:3100 process) — the public server list, the admin console, and
# the download/about tabs. The game's own nginx locations (R2 302s, /js /data /sim /shared /vendor, /ws) moved
# with it; nothing of the game is served from this name any more, so the two apps never share a path.

server {
    listen 80;
    listen [::]:80;
    server_name game.xiaolubao.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name game.xiaolubao.com;

    ssl_certificate     /etc/nginx/ssl/xiaolubao/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/xiaolubao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 2m;

    # Players who played here still have the GAME's Service Worker registered on this origin. It answers
    # /fonts/** and /assets/** out of the game cache — which would shadow this site's own /fonts/fonts.css.
    # This stub replaces it: the browser installs it on its next update check and it unregisters itself.
    # Cache Storage is left untouched (the game's cache belongs to an origin that no longer serves the game).
    location = /resource-sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        return 200 'self.addEventListener("install", () => self.skipWaiting());
self.addEventListener("activate", (event) => event.waitUntil(self.registration.unregister().then(() => self.clients.claim())));
';
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
