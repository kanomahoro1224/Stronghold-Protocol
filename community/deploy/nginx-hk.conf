# hk.xiaolubao.com — the game server's public reverse proxy.
#
# Moved here verbatim from game.xiaolubao.com.conf (2026-10-08): game.xiaolubao.com now serves the community
# site, so the game's own name is the regional node name hk.xiaolubao.com (the wildcard *.xiaolubao.com cert
# already covers it). The maps below are http-context and are defined here only — do not duplicate them.
#
#   * TLS lives on 443 (this box has no stream/SNI router and no sing-box; 443 is free).
#   * sp-code-version.conf defaults to "" here, so /js /css /data /sim /shared /vendor are served by
#     the local node server (the layout the code expects) instead of the R2 version prefix.
#   * /assets /media /fonts keep the R2 302 offload: they are ~90% of egress and the R2 tree is shared
#     with the other boxes, so both serve byte-identical art.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 302 目标里拼缓存版本号时要选对分隔符（$request_uri 含查询串，可能已经有 ?）
map $request_uri $r2_sep {
    ~\?    '&';
    default '?';
}

# 带 Origin 的请求与不带 Origin 的请求拿到不同的 R2 URL，避免边缘把无 Origin 的副本发给带 Origin 的请求
map $http_origin $r2_co {
    ''      '';
    default '&co=1';
}

server {
    listen 80;
    listen [::]:80;
    server_name hk.xiaolubao.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hk.xiaolubao.com;

    ssl_certificate     /etc/nginx/ssl/xiaolubao/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/xiaolubao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 2m;

    # ---- 静态素材卸载到 R2（图片 / Spine / 3D 贴图 / 音频）--------------------------------
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header Vary Origin always;
        return 302 https://local.xiaolubao.com/Stronghold-Protocol$request_uri${r2_sep}r2v=2${r2_co};
    }

    location ^~ /media/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header Vary Origin always;
        return 302 https://local.xiaolubao.com/Stronghold-Protocol$request_uri${r2_sep}r2v=2${r2_co};
    }

    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header Vary Origin always;
        return 302 https://local.xiaolubao.com/Stronghold-Protocol$request_uri${r2_sep}r2v=2${r2_co};
    }

    # ---- 客户端代码：默认本机服务；sp-code-version.conf 里那一行非空时改走 R2 ----------------
    # Service Worker 脚本不能位于重定向之后（Chrome: "The script resource is behind a redirect"），
    # 所以 /resource-sw.js 与 /js/resources/ 永远回源。
    location = /resource-sw.js { proxy_pass http://127.0.0.1:3000; }
    location ^~ /js/resources/ { proxy_pass http://127.0.0.1:3000; }

    location ^~ /js/ {
        if ($sp_code_url != "") {
            add_header Cache-Control "public, max-age=300" always;
            return 302 $sp_code_url$request_uri;
        }
        proxy_pass http://127.0.0.1:3000;
    }

    location ^~ /css/ {
        if ($sp_code_url != "") {
            add_header Cache-Control "public, max-age=300" always;
            return 302 $sp_code_url$request_uri;
        }
        proxy_pass http://127.0.0.1:3000;
    }

    # 离线资源清单由游戏服务器生成，不在 R2 静态前缀里，必须回源
    location = /data/resource-manifest.json {
        proxy_pass http://127.0.0.1:3000;
    }

    location ^~ /data/ {
        if ($sp_code_url != "") {
            add_header Cache-Control "public, max-age=300" always;
            return 302 $sp_code_url$request_uri;
        }
        proxy_pass http://127.0.0.1:3000;
    }

    location ^~ /sim/ {
        if ($sp_code_url != "") {
            add_header Cache-Control "public, max-age=300" always;
            return 302 $sp_code_url$request_uri;
        }
        proxy_pass http://127.0.0.1:3000;
    }

    location ^~ /shared/ {
        if ($sp_code_url != "") {
            add_header Cache-Control "public, max-age=300" always;
            return 302 $sp_code_url$request_uri;
        }
        proxy_pass http://127.0.0.1:3000;
    }

    location ^~ /vendor/ {
        if ($sp_code_url != "") {
            add_header Cache-Control "public, max-age=300" always;
            return 302 $sp_code_url$request_uri;
        }
        proxy_pass http://127.0.0.1:3000;
    }

    # 镜像绝对路径被用在 document 相对场景时（<script src>/fetch/new Image）救活调用方
    location ^~ /Stronghold-Protocol/ {
        add_header Cache-Control "public, max-age=300" always;
        return 302 https://local.xiaolubao.com$request_uri;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
